<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>報告順序與分組抽籤工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .shuffling-glow {
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight">報告順序 ＆ 分組抽籤器</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">支援智慧名單解析、逐一揭曉與一鍵匯出</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <button id="btnShareLink" onclick="copyShareUrl()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-600 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:text-indigo-300 dark:hover:bg-indigo-900/60 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
          <span>分享此名單網址</span>
        </button>

        <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition" title="切換深色/淺色模式">
          <svg id="iconSun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="iconMoon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">

      <!-- 左側：名單與設定面板 (佔 4 欄) -->
      <div class="lg:col-span-4 space-y-5 bg-white dark:bg-slate-800 p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
        
        <!-- 活動標題 -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">抽籤標題（選填）</label>
          <input type="text" id="eventTitle" placeholder="例如：期末專題報告順序" 
            class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/60 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" />
        </div>

        <!-- 名單輸入區 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">參與名單</label>
            <span id="participantCount" class="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300">0 人</span>
          </div>
          <textarea id="nameInput" rows="7" placeholder="請輸入名單，支援換行、逗號或頓號分隔：&#10;王小明&#10;李小華&#10;陳大文&#10;林美玲&#10;張志豪&#10;黃雅婷"
            class="w-full p-3.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/60 text-sm leading-relaxed focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition resize-y"></textarea>
          
          <div class="flex flex-wrap items-center justify-between gap-2 mt-2">
            <div class="flex items-center gap-3">
              <label class="inline-flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-300 cursor-pointer select-none">
                <input type="checkbox" id="deduplicateCheck" checked class="rounded text-indigo-600 focus:ring-indigo-500">
                <span>自動排除重複</span>
              </label>
            </div>
            <div class="flex items-center gap-2 text-xs">
              <button type="button" onclick="loadSampleData()" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">載入範例</button>
              <span class="text-slate-300 dark:text-slate-600">|</span>
              <button type="button" onclick="clearNames()" class="text-rose-500 hover:underline font-medium">清空</button>
            </div>
          </div>
        </div>

        <hr class="border-slate-200 dark:border-slate-700" />

        <!-- 抽籤模式選擇 -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">選擇抽籤模式</label>
          <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 dark:bg-slate-900 rounded-xl">
            <button type="button" id="tabOrder" onclick="switchMode('order')" 
              class="py-2 px-3 rounded-lg text-sm font-bold transition shadow-sm bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300">
              📋 報告順序
            </button>
            <button type="button" id="tabGroup" onclick="switchMode('group')" 
              class="py-2 px-3 rounded-lg text-sm font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
              👥 隨機分組
            </button>
          </div>
        </div>

        <!-- 模式專屬設定 -->
        <div id="orderSettings" class="space-y-3 bg-slate-50 dark:bg-slate-900/50 p-3.5 rounded-xl border border-slate-200/70 dark:border-slate-700/70">
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300">揭曉方式</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50/50 dark:has-[:checked]:bg-indigo-950/30">
              <input type="radio" name="revealType" value="all" checked class="text-indigo-600 focus:ring-indigo-500">
              <span class="text-xs font-medium">一次全部揭曉</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50/50 dark:has-[:checked]:bg-indigo-950/30">
              <input type="radio" name="revealType" value="step" class="text-indigo-600 focus:ring-indigo-500">
              <span class="text-xs font-medium">逐一唱名揭曉</span>
            </label>
          </div>
        </div>

        <div id="groupSettings" class="hidden space-y-3 bg-slate-50 dark:bg-slate-900/50 p-3.5 rounded-xl border border-slate-200/70 dark:border-slate-700/70">
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer has-[:checked]:border-indigo-500">
              <input type="radio" name="groupBy" value="count" checked onchange="updateGroupHint()" class="text-indigo-600 focus:ring-indigo-500">
              <span class="text-xs font-medium">指定「總組數」</span>
            </label>
            <label class="flex items-center gap-2 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 cursor-pointer has-[:checked]:border-indigo-500">
              <input type="radio" name="groupBy" value="size" onchange="updateGroupHint()" class="text-indigo-600 focus:ring-indigo-500">
              <span class="text-xs font-medium">指定「每組人數」</span>
            </label>
          </div>
          <div class="flex items-center gap-3">
            <input type="number" id="groupNumberInput" min="2" max="100" value="3" oninput="updateGroupHint()"
              class="w-24 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-bold text-center focus:ring-2 focus:ring-indigo-500 outline-none">
            <span id="groupHintText" class="text-xs text-slate-500 dark:text-slate-400">將平均分成 3 組</span>
          </div>
        </div>

        <!-- 開始抽籤按鈕 -->
        <button id="btnStartDraw" onclick="startDraw()" 
          class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-[0.99] text-white font-bold text-base shadow-lg shadow-indigo-500/30 transition flex items-center justify-center gap-2 cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>開始抽籤！</span>
        </button>

      </div>

      <!-- 右側：結果展示舞台 (佔 8 欄) -->
      <div id="stageContainer" class="lg:col-span-8 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 min-h-[520px] flex flex-col transition-all duration-300">
        
        <!-- 舞台頂部工具列 -->
        <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 id="stageTitle" class="text-lg font-bold text-slate-800 dark:text-white">抽籤結果舞台</h2>
            <p id="stageSubtitle" class="text-xs text-slate-500 dark:text-slate-400">在左側輸入名單並按下「開始抽籤」</p>
          </div>

          <div id="resultActions" class="hidden flex items-center gap-2">
            <button onclick="copyResults()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
              <span>複製文字</span>
            </button>
            <button onclick="downloadCSV()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/60 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              <span>下載 CSV</span>
            </button>
            <button onclick="startDraw()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/60 text-indigo-600 dark:text-indigo-300 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              <span>重新抽籤</span>
            </button>
          </div>
        </div>

        <!-- 舞台內容區域 -->
        <div id="stageBody" class="flex-1 p-6 flex flex-col justify-center">
          <!-- 初始空狀態 -->
          <div id="emptyState" class="text-center py-12 max-w-md mx-auto">
            <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-500 flex items-center justify-center">
              <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            </div>
            <h3 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">準備好進行公平隨機抽籤了嗎？</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">本工具採用 Fisher-Yates 演算法確保絕對隨機公平。您可以直接貼上 Excel 欄位或任何文字名單。</p>
            <button onclick="loadSampleData(); startDraw();" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition">
              <span>✨ 試試看範例抽籤</span>
            </button>
          </div>

          <!-- 洗牌動畫區 -->
          <div id="shufflingState" class="hidden text-center py-16">
            <div class="inline-block px-8 py-6 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border-2 border-indigo-400 dark:border-indigo-500 mb-4">
              <span id="rollingName" class="text-3xl sm:text-4xl font-black text-indigo-600 dark:text-indigo-300 tracking-wider">洗牌中...</span>
            </div>
            <p class="text-sm font-medium text-slate-500 dark:text-slate-400 animate-pulse">正在隨機打亂順序...</p>
          </div>

          <!-- 逐一揭曉控制區 -->
          <div id="stepRevealBanner" class="hidden mb-6 p-4 rounded-2xl bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-950/40 dark:to-orange-950/40 border border-amber-200 dark:border-amber-800/60 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-500 text-white font-black text-lg shadow-sm" id="nextOrderBadge">1</span>
              <div>
                <p class="text-xs font-bold text-amber-800 dark:text-amber-300">逐一唱名模式進行中</p>
                <p class="text-xs text-amber-700/80 dark:text-amber-400/80" id="stepProgressText">已揭曉 0 / 0 位</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button id="btnRevealNext" onclick="revealNextStep()" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold text-sm shadow-md shadow-amber-500/20 transition cursor-pointer">
                🎉 揭曉下一位！
              </button>
              <button id="btnRevealAllRemaining" onclick="revealAllSteps()" class="px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 font-semibold text-xs transition cursor-pointer">
                全部揭曉
              </button>
            </div>
          </div>

          <!-- 結果顯示容器 -->
          <div id="resultsContainer" class="hidden w-full"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Toast 提示訊息 -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2">
      <span id="toastIcon">✅</span>
      <span id="toastMsg">操作成功</span>
    </div>
  </div>

  <script>
    // 狀態管理
    let currentMode = 'order'; // 'order' | 'group'
    let drawnOrderList = [];
    let revealedCount = 0;
    let drawnGroupsList = [];
    let isAnimating = false;

    const groupColors = [
      { bg: 'bg-indigo-50 dark:bg-indigo-950/40', border: 'border-indigo-200 dark:border-indigo-800/60', badge: 'bg-indigo-600 text-white', text: 'text-indigo-900 dark:text-indigo-200' },
      { bg: 'bg-emerald-50 dark:bg-emerald-950/40', border: 'border-emerald-200 dark:border-emerald-800/60', badge: 'bg-emerald-600 text-white', text: 'text-emerald-900 dark:text-emerald-200' },
      { bg: 'bg-amber-50 dark:bg-amber-950/40', border: 'border-amber-200 dark:border-amber-800/60', badge: 'bg-amber-600 text-white', text: 'text-amber-900 dark:text-amber-200' },
      { bg: 'bg-rose-50 dark:bg-rose-950/40', border: 'border-rose-200 dark:border-rose-800/60', badge: 'bg-rose-600 text-white', text: 'text-rose-900 dark:text-rose-200' },
      { bg: 'bg-cyan-50 dark:bg-cyan-950/40', border: 'border-cyan-200 dark:border-cyan-800/60', badge: 'bg-cyan-600 text-white', text: 'text-cyan-900 dark:text-cyan-200' },
      { bg: 'bg-purple-50 dark:bg-purple-950/40', border: 'border-purple-200 dark:border-purple-800/60', badge: 'bg-purple-600 text-white', text: 'text-purple-900 dark:text-purple-200' },
    ];

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      loadFromUrlParams();
      parseNames();
    });

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    }

    function parseNames() {
      const raw = document.getElementById('nameInput').value;
      const deduplicate = document.getElementById('deduplicateCheck').checked;
      let list = raw.split(/[\n,，、;；\t]+/).map(s => s.trim()).filter(s => s.length > 0);
      if (deduplicate) {
        list = [...new Set(list)];
      }
      document.getElementById('participantCount').textContent = `${list.length} 人`;
      updateGroupHint(list.length);
      return list;
    }

    document.getElementById('nameInput').addEventListener('input', parseNames);
    document.getElementById('deduplicateCheck').addEventListener('change', parseNames);

    function loadSampleData() {
      const samples = [
        "陳冠宇", "林雅婷", "黃俊傑", "張怡君", "李宗翰",
        "王詩涵", "吳承翰", "劉佳穎", "蔡宇軒", "楊佩珊",
        "許家豪", "鄭心怡"
      ];
      document.getElementById('eventTitle').value = "專題報告順序與分組";
      document.getElementById('nameInput').value = samples.join('\n');
      parseNames();
      showToast('已載入 12 位範例名單');
    }

    function clearNames() {
      document.getElementById('nameInput').value = '';
      parseNames();
    }

    function switchMode(mode) {
      currentMode = mode;
      const tabOrder = document.getElementById('tabOrder');
      const tabGroup = document.getElementById('tabGroup');
      const orderSettings = document.getElementById('orderSettings');
      const groupSettings = document.getElementById('groupSettings');

      if (mode === 'order') {
        tabOrder.className = "py-2 px-3 rounded-lg text-sm font-bold transition shadow-sm bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300";
        tabGroup.className = "py-2 px-3 rounded-lg text-sm font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
        orderSettings.classList.remove('hidden');
        groupSettings.classList.add('hidden');
      } else {
        tabGroup.className = "py-2 px-3 rounded-lg text-sm font-bold transition shadow-sm bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300";
        tabOrder.className = "py-2 px-3 rounded-lg text-sm font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
        groupSettings.classList.remove('hidden');
        orderSettings.classList.add('hidden');
        updateGroupHint();
      }
    }

    function updateGroupHint(totalCount) {
      if (typeof totalCount !== 'number') {
        const raw = document.getElementById('nameInput').value;
        const deduplicate = document.getElementById('deduplicateCheck').checked;
        let list = raw.split(/[\n,，、;；\t]+/).map(s => s.trim()).filter(s => s.length > 0);
        if (deduplicate) list = [...new Set(list)];
        totalCount = list.length;
      }

      const groupBy = document.querySelector('input[name="groupBy"]:checked').value;
      const num = Math.max(1, parseInt(document.getElementById('groupNumberInput').value) || 2);
      const hintEl = document.getElementById('groupHintText');

      if (totalCount === 0) {
        hintEl.textContent = groupBy === 'count' ? `將平均分成 ${num} 組` : `每組約 ${num} 人`;
        return;
      }

      if (groupBy === 'count') {
        const actualGroups = Math.min(num, totalCount);
        const baseSize = Math.floor(totalCount / actualGroups);
        const remainder = totalCount % actualGroups;
        hintEl.textContent = remainder === 0 
          ? `共 ${actualGroups} 組，每組 ${baseSize} 人` 
          : `共 ${actualGroups} 組，每組 ${baseSize}~${baseSize + 1} 人`;
      } else {
        const groupsCount = Math.ceil(totalCount / num);
        hintEl.textContent = `約分成 ${groupsCount} 組（每組最多 ${num} 人）`;
      }
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startDraw() {
      if (isAnimating) return;
      const names = parseNames();

      if (names.length < 2) {
        showToast('請至少輸入 2 位參與者名單！', '⚠️');
        document.getElementById('nameInput').focus();
        return;
      }

      isAnimating = true;
      const stageContainer = document.getElementById('stageContainer');
      const emptyState = document.getElementById('emptyState');
      const shufflingState = document.getElementById('shufflingState');
      const resultsContainer = document.getElementById('resultsContainer');
      const stepBanner = document.getElementById('stepRevealBanner');
      const resultActions = document.getElementById('resultActions');
      const rollingName = document.getElementById('rollingName');

      emptyState.classList.add('hidden');
      resultsContainer.classList.add('hidden');
      stepBanner.classList.add('hidden');
      resultActions.classList.add('hidden');
      shufflingState.classList.remove('hidden');
      stageContainer.classList.add('shuffling-glow');

      let ticks = 0;
      const maxTicks = 16;
      const interval = setInterval(() => {
        const randomName = names[Math.floor(Math.random() * names.length)];
        rollingName.textContent = randomName;
        ticks++;
        if (ticks >= maxTicks) {
          clearInterval(interval);
          finalizeDraw(names);
        }
      }, 55);
    }

    function finalizeDraw(names) {
      isAnimating = false;
      const stageContainer = document.getElementById('stageContainer');
      const shufflingState = document.getElementById('shufflingState');
      const resultsContainer = document.getElementById('resultsContainer');
      const resultActions = document.getElementById('resultActions');

      shufflingState.classList.add('hidden');
      stageContainer.classList.remove('shuffling-glow');
      resultsContainer.classList.remove('hidden');
      resultActions.classList.remove('hidden');

      const titleVal = document.getElementById('eventTitle').value.trim();
      const nowStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      if (currentMode === 'order') {
        drawnOrderList = shuffleArray(names);
        const revealType = document.querySelector('input[name="revealType"]:checked').value;
        
        document.getElementById('stageTitle').textContent = titleVal ? `${titleVal} — 報告順序` : '報告順序抽籤結果';
        document.getElementById('stageSubtitle').textContent = `共 ${drawnOrderList.length} 位參與者 • 抽籤時間 ${nowStr}`;

        if (revealType === 'all') {
          revealedCount = drawnOrderList.length;
          document.getElementById('stepRevealBanner').classList.add('hidden');
          renderOrderCards();
          triggerConfetti();
        } else {
          revealedCount = 1;
          document.getElementById('stepRevealBanner').classList.remove('hidden');
          updateStepBanner();
          renderOrderCards();
        }
      } else {
        const shuffled = shuffleArray(names);
        const groupBy = document.querySelector('input[name="groupBy"]:checked').value;
        const num = Math.max(1, parseInt(document.getElementById('groupNumberInput').value) || 2);
        
        drawnGroupsList = [];
        if (groupBy === 'count') {
          const groupCount = Math.min(num, shuffled.length);
          for (let i = 0; i < groupCount; i++) drawnGroupsList.push([]);
          shuffled.forEach((person, idx) => {
            drawnGroupsList[idx % groupCount].push(person);
          });
        } else {
          for (let i = 0; i < shuffled.length; i += num) {
            drawnGroupsList.push(shuffled.slice(i, i + num));
          }
        }

        document.getElementById('stepRevealBanner').classList.add('hidden');
        document.getElementById('stageTitle').textContent = titleVal ? `${titleVal} — 分組結果` : '隨機分組結果';
        document.getElementById('stageSubtitle').textContent = `共分成 ${drawnGroupsList.length} 組（總計 ${names.length} 人）• 抽籤時間 ${nowStr}`;
        renderGroupCards();
        triggerConfetti();
      }
    }

    function renderOrderCards() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5';

      drawnOrderList.forEach((name, index) => {
        const orderNum = index + 1;
        const isRevealed = index < revealedCount;
        const card = document.createElement('div');

        if (isRevealed) {
          const isFirst = orderNum === 1;
          card.className = `animate-pop flex items-center gap-3.5 p-3.5 rounded-xl border ${
            isFirst 
              ? 'bg-indigo-50/80 dark:bg-indigo-950/50 border-indigo-300 dark:border-indigo-700 shadow-sm' 
              : 'bg-slate-50 dark:bg-slate-900/60 border-slate-200 dark:border-slate-700'
          }`;
          card.innerHTML = `
            <div class="w-9 h-9 rounded-lg flex items-center justify-center font-black text-sm shrink-0 ${
              isFirst ? 'bg-indigo-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200'
            }">
              ${orderNum}
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-base font-bold text-slate-800 dark:text-slate-100 truncate">${escapeHtml(name)}</div>
              <div class="text-[11px] text-slate-400 dark:text-slate-500">第 ${orderNum} 順位</div>
            </div>
          `;
        } else {
          card.className = 'flex items-center gap-3.5 p-3.5 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50/40 dark:bg-slate-900/20 opacity-60';
          card.innerHTML = `
            <div class="w-9 h-9 rounded-lg flex items-center justify-center font-bold text-sm shrink-0 bg-slate-200/70 dark:bg-slate-800 text-slate-400">
              ${orderNum}
            </div>
            <div class="text-sm font-medium text-slate-400 dark:text-slate-500">等待揭曉...</div>
          `;
        }
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    function updateStepBanner() {
      const total = drawnOrderList.length;
      document.getElementById('stepProgressText').textContent = `已揭曉 ${revealedCount} / ${total} 位`;
      if (revealedCount < total) {
        document.getElementById('nextOrderBadge').textContent = revealedCount + 1;
      } else {
        document.getElementById('stepRevealBanner').classList.add('hidden');
        triggerConfetti();
      }
    }

    function revealNextStep() {
      if (revealedCount < drawnOrderList.length) {
        revealedCount++;
        renderOrderCards();
        updateStepBanner();
      }
    }

    function revealAllSteps() {
      revealedCount = drawnOrderList.length;
      renderOrderCards();
      updateStepBanner();
    }

    function renderGroupCards() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

      drawnGroupsList.forEach((members, gIdx) => {
        const theme = groupColors[gIdx % groupColors.length];
        const card = document.createElement('div');
        card.style.animationDelay = `${gIdx * 60}ms`;
        card.className = `animate-pop rounded-2xl border ${theme.border} ${theme.bg} p-4 flex flex-col`;

        const membersHtml = members.map((m, mIdx) => `
          <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-white/80 dark:bg-slate-800/80 text-sm font-semibold text-slate-800 dark:text-slate-100 shadow-xs">
            <span>${escapeHtml(m)}</span>
            ${mIdx === 0 ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200/80 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium">組長預設</span>' : ''}
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg text-xs font-black ${theme.badge}">第 ${gIdx + 1} 組</span>
            </div>
            <span class="text-xs font-bold ${theme.text}">${members.length} 人</span>
          </div>
          <div class="space-y-2 flex-1">
            ${membersHtml}
          </div>
        `;
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    function copyResults() {
      const titleVal = document.getElementById('eventTitle').value.trim();
      let text = titleVal ? `【${titleVal}】\n` : '';

      if (currentMode === 'order') {
        text += '📋 報告順序抽籤結果：\n';
        drawnOrderList.forEach((name, idx) => {
          text += `${idx + 1}. ${name}\n`;
        });
      } else {
        text += '👥 隨機分組結果：\n';
        drawnGroupsList.forEach((group, gIdx) => {
          text += `第 ${gIdx + 1} 組：${group.join('、')}\n`;
        });
      }

      navigator.clipboard.writeText(text).then(() => {
        showToast('已複製抽籤結果到剪貼簿！');
      });
    }

    function downloadCSV() {
      let csvContent = "\uFEFF";
      if (currentMode === 'order') {
        csvContent += "順序,姓名\n";
        drawnOrderList.forEach((name, idx) => {
          csvContent += `${idx + 1},"${name.replace(/"/g, '""')}"\n`;
        });
      } else {
        csvContent += "組別,組內順序,姓名\n";
        drawnGroupsList.forEach((group, gIdx) => {
          group.forEach((name, mIdx) => {
            csvContent += `第 ${gIdx + 1} 組,${mIdx + 1},"${name.replace(/"/g, '""')}"\n`;
          });
        });
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      const filename = currentMode === 'order' ? '報告順序結果.csv' : '隨機分組結果.csv';
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast(`已匯出 ${filename}`);
    }

    function copyShareUrl() {
      const names = parseNames();
      const titleVal = document.getElementById('eventTitle').value.trim();
      const url = new URL(window.location.href);
      if (titleVal) url.searchParams.set('title', titleVal);
      else url.searchParams.delete('title');

      if (names.length > 0) url.searchParams.set('names', names.join(','));
      else url.searchParams.delete('names');

      url.searchParams.set('mode', currentMode);

      navigator.clipboard.writeText(url.toString()).then(() => {
        showToast('已複製包含名單的分享網址！');
      });
    }

    function loadFromUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title');
      const names = params.get('names');
      const mode = params.get('mode');

      if (title) document.getElementById('eventTitle').value = title;
      if (names) {
        document.getElementById('nameInput').value = names.split(',').join('\n');
      }
      if (mode === 'group' || mode === 'order') {
        switchMode(mode);
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 65,
          spread: 70,
          origin: { y: 0.65 }
        });
      }
    }

    function showToast(msg, icon = '✅') {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toastIcon').textContent = icon;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2800);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
